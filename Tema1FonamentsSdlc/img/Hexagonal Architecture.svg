<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Arial">

  <text x="300" y="40" font-size="22" text-anchor="middle" font-weight="bold">
    Hexagonal Architecture (Ports & Adapters)
  </text>

  <!-- Hexagon -->
  <polygon points="300,90 430,170 430,330 300,410 170,330 170,170"
           fill="#e7f7ec" stroke="#34a853" stroke-width="3"/>

  <!-- Domain -->
  <circle cx="300" cy="250" r="55" fill="#fdecef" stroke="#d63384" stroke-width="3"/>
  <text x="300" y="255" text-anchor="middle" font-size="16">Domain</text>

  <!-- Ports -->
  <text x="300" y="150" text-anchor="middle" font-size="16">Ports</text>
  <text x="300" y="365" text-anchor="middle" font-size="16">Ports</text>

  <!-- Adapters -->
  <text x="430" y="250" text-anchor="start" font-size="16">Adapters</text>
  <text x="130" y="250" text-anchor="end" font-size="16">Adapters</text>

  <!-- Drivers -->
  <text x="300" y="75" text-anchor="middle" font-size="14">Drivers (Inputs)</text>

  <!-- Driven -->
  <text x="300" y="440" text-anchor="middle" font-size="14">Driven (Resources)</text>

</svg>
