<svg width="740" height="360" xmlns="http://www.w3.org/2000/svg">

  <text x="370" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Factory Method Pattern
  </text>

  <!-- Creator -->
  <rect x="250" y="70" width="240" height="60" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="370" y="105" text-anchor="middle" font-size="16" fill="#1e3a8a">Classe Abstracta: VehicleFactory</text>

  <!-- Concrete Factories -->
  <rect x="60" y="170" width="260" height="55" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="190" y="203" text-anchor="middle" font-size="14" fill="#92400e">CotxeFactory</text>

  <rect x="420" y="170" width="260" height="55" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="550" y="203" text-anchor="middle" font-size="14" fill="#92400e">MotoFactory</text>

  <!-- Products -->
  <rect x="110" y="270" width="160" height="50" rx="10" fill="#ecfdf5" stroke="#065f46" stroke-width="2"/>
  <text x="190" y="300" text-anchor="middle" font-size="14" fill="#065f46">Cotxe</text>

  <rect x="470" y="270" width="160" height="50" rx="10" fill="#ecfdf5" stroke="#065f46" stroke-width="2"/>
  <text x="550" y="300" text-anchor="middle" font-size="14" fill="#065f46">Moto</text>

  <!-- Arrows -->
  <line x1="370" y1="130" x2="190" y2="170" stroke="#1e293b" stroke-width="2"/>
  <line x1="370" y1="130" x2="550" y2="170" stroke="#1e293b" stroke-width="2"/>

  <line x1="190" y1="225" x2="190" y2="270" stroke="#b45309" stroke-width="2"/>
  <line x1="550" y1="225" x2="550" y2="270" stroke="#b45309" stroke-width="2"/>

</svg>
