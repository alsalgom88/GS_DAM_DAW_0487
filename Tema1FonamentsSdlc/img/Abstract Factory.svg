<svg width="820" height="430" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="410" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Abstract Factory Pattern
  </text>

  <!-- Abstract Factory -->
  <rect x="300" y="60" width="220" height="60" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="410" y="95" text-anchor="middle" font-size="16" fill="#1e3a8a">FÀBRICA ABSTRACTA</text>

  <!-- Concrete Factories -->
  <rect x="120" y="160" width="220" height="60" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
  <text x="230" y="195" text-anchor="middle" font-size="14" fill="#9f1239">FàbricaWindows</text>

  <rect x="480" y="160" width="220" height="60" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
  <text x="590" y="195" text-anchor="middle" font-size="14" fill="#9f1239">FàbricaMacOS</text>

  <!-- Product Families -->
  <rect x="80" y="280" width="160" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="160" y="310" text-anchor="middle" font-size="12" fill="#065f46">Botó Windows</text>

  <rect x="260" y="280" width="160" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="340" y="310" text-anchor="middle" font-size="12" fill="#065f46">Finestra Windows</text>

  <rect x="440" y="280" width="160" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="520" y="310" text-anchor="middle" font-size="12" fill="#065f46">Botó MacOS</text>

  <rect x="620" y="280" width="160" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="700" y="310" text-anchor="middle" font-size="12" fill="#065f46">Finestra MacOS</text>

  <!-- Arrows -->
  <line x1="410" y1="120" x2="230" y2="160" stroke="#1e293b" stroke-width="2"/>
  <line x1="410" y1="120" x2="590" y2="160" stroke="#1e293b" stroke-width="2"/>
  
  <line x1="230" y1="220" x2="160" y2="280" stroke="#be123c" stroke-width="2"/>
  <line x1="230" y1="220" x2="340" y2="280" stroke="#be123c" stroke-width="2"/>

  <line x1="590" y1="220" x2="520" y2="280" stroke="#be123c" stroke-width="2"/>
  <line x1="590" y1="220" x2="700" y2="280" stroke="#be123c" stroke-width="2"/>
</svg>
