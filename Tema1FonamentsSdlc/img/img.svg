<svg width="920" height="620" viewBox="0 0 920 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Title -->
  <text x="50%" y="40" font-size="28" font-weight="bold" text-anchor="middle">
    Comparativa d'Arquitectures de Programari
  </text>

  <!-- Three Layer Box -->
  <rect x="40" y="80" width="240" height="180" rx="12" ry="12" fill="#e8f0fe" stroke="#4a78dd" stroke-width="2"/>
  <text x="160" y="110" font-size="20" font-weight="bold" text-anchor="middle">3 Capes</text>
  <text x="160" y="140" font-size="14" text-anchor="middle">Presentació → Negoci → Dades</text>
  <text x="160" y="170" font-size="14" text-anchor="middle">Flux lineal</text>
  <text x="160" y="200" font-size="14" text-anchor="middle">Simple i educativa</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="170" x2="360" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Clean Architecture -->
  <rect x="360" y="80" width="240" height="180" rx="12" ry="12" fill="#e7f7ec" stroke="#34a853" stroke-width="2"/>
  <text x="480" y="110" font-size="20" font-weight="bold" text-anchor="middle">Clean</text>
  <text x="480" y="140" font-size="14" text-anchor="middle">Capes concèntriques</text>
  <text x="480" y="170" font-size="14" text-anchor="middle">Domini al centre</text>
  <text x="480" y="200" font-size="14" text-anchor="middle">Més flexible i testejable</text>

  <!-- Arrow 2 -->
  <line x1="600" y1="170" x2="680" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hexagonal -->
  <rect x="680" y="80" width="240" height="180" rx="12" ry="12" fill="#fff3cd" stroke="#e0a800" stroke-width="2"/>
  <text x="800" y="110" font-size="20" font-weight="bold" text-anchor="middle">Hexagonal</text>
  <text x="800" y="140" font-size="14" text-anchor="middle">Ports i Adaptadors</text>
  <text x="800" y="170" font-size="14" text-anchor="middle">Drivers / Driven</text>
  <text x="800" y="200" font-size="14" text-anchor="middle">Extremadament modular</text>

  <!-- Onion Architecture Box (center bottom) -->
  <rect x="260" y="320" width="400" height="200" rx="12" ry="12" fill="#fdecef" stroke="#d63384" stroke-width="2"/>
  <text x="460" y="350" font-size="20" font-weight="bold" text-anchor="middle">Onion Architecture</text>
  <text x="460" y="380" font-size="14" text-anchor="middle">Capes concèntriques pures</text>
  <text x="460" y="410" font-size="14" text-anchor="middle">Domini absolutament protegit</text>
  <text x="460" y="440" font-size="14" text-anchor="middle">Molt similar a Clean</text>

  <!-- Arrow Down from Clean -->
  <line x1="480" y1="260" x2="480" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>


  <!-- Arrow Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" fill="#555">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

</svg>
