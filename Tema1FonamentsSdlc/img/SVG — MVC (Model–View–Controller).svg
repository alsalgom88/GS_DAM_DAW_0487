<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Fons -->
  <rect x="0" y="0" width="900" height="260" fill="#0f172a" rx="16"/>

  <!-- Títol -->
  <text x="450" y="32" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="20" fill="#e5e7eb" font-weight="600">
    Patró MVC — Model · View · Controller
  </text>
  <text x="450" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="#9ca3af">
    La vista delega les accions al Controller, que treballa amb el Model i actualitza la View
  </text>

  <!-- Usuari -->
  <circle cx="80" cy="140" r="32" fill="#1d4ed8"/>
  <text x="80" y="136" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="26" fill="#e5e7eb">👤</text>
  <text x="80" y="178" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#e5e7eb">Usuari</text>

  <!-- Vista -->
  <rect x="170" y="90" width="170" height="110" rx="12" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
  <text x="255" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="#bfdbfe" font-weight="600">View</text>
  <text x="255" y="138" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">UI, pantalles, HTML</text>
  <text x="255" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">rep esdeveniments</text>

  <!-- Controller -->
  <rect x="370" y="90" width="170" height="110" rx="12" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <text x="455" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="#bbf7d0" font-weight="600">Controller</text>
  <text x="455" y="138" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">rep accions de la View</text>
  <text x="455" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">orquestra la lògica</text>

  <!-- Model -->
  <rect x="570" y="90" width="170" height="110" rx="12" fill="#111827" stroke="#f97316" stroke-width="2"/>
  <text x="655" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="#fed7aa" font-weight="600">Model</text>
  <text x="655" y="138" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">dades i regles</text>
  <text x="655" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">d’accés a dades</text>

  <!-- DB icona -->
  <ellipse cx="810" cy="130" rx="36" ry="20" fill="#0b1120" stroke="#f97316" stroke-width="2"/>
  <ellipse cx="810" cy="130" rx="36" ry="8" fill="#111827" stroke="#f97316" stroke-width="2"/>
  <rect x="774" y="130" width="72" height="40" fill="#111827" stroke="#f97316" stroke-width="2"/>
  <text x="810" y="158" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#fed7aa">DB / API</text>

  <!-- Fletxes Usuari -> View -->
  <defs>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#e5e7eb"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#34d399"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#f97316"/>
    </marker>
  </defs>

  <line x1="112" y1="140" x2="170" y2="140" stroke="#e5e7eb" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <text x="140" y="132" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#e5e7eb">clic, input</text>

  <!-- View -> Controller -->
  <line x1="340" y1="120" x2="370" y2="120" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="355" y="110" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#bfdbfe">acció</text>

  <!-- Controller -> Model -->
  <line x1="540" y1="120" x2="570" y2="120" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="555" y="110" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#bbf7d0">operació</text>

  <!-- Model -> DB -->
  <line x1="740" y1="130" x2="774" y2="130" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="757" y="120" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#fed7aa">consulta</text>

  <!-- Model -> Controller (dades) -->
  <line x1="570" y1="160" x2="540" y2="160" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="555" y="174" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#bbf7d0">resultat</text>

  <!-- Controller -> View (actualització) -->
  <line x1="370" y1="160" x2="340" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="355" y="174" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#bfdbfe">model → vista</text>
</svg>
