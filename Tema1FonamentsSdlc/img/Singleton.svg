<svg width="600" height="310" xmlns="http://www.w3.org/2000/svg">

  <text x="300" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Singleton Pattern
  </text>

  <!-- Singleton box -->
  <rect x="160" y="70" width="280" height="160" rx="12" fill="#fde68a" stroke="#b45309" stroke-width="3"/>

  <text x="300" y="110" text-anchor="middle" font-size="16" fill="#78350f">
    Classe: ConfigSingleton
  </text>

  <text x="300" y="145" text-anchor="middle" font-size="14" fill="#7c2d12">
    - instance: ConfigSingleton
  </text>
  
  <text x="300" y="175" text-anchor="middle" font-size="14" fill="#7c2d12">
    + getInstance(): ConfigSingleton
  </text>

  <text x="300" y="205" text-anchor="middle" font-size="14" fill="#7c2d12">
    + getConfig()
  </text>

  <!-- Users accessing the Singleton -->
  <circle cx="100" cy="260" r="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="100" y="265" text-anchor="middle" font-size="12">A</text>

  <circle cx="300" cy="260" r="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="300" y="265" text-anchor="middle" font-size="12">B</text>

  <circle cx="500" cy="260" r="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="500" y="265" text-anchor="middle" font-size="12">C</text>

  <!-- Arrows -->
  <line x1="100" y1="238" x2="300" y2="230" stroke="#b45309" stroke-width="2"/>
  <line x1="300" y1="238" x2="300" y2="230" stroke="#b45309" stroke-width="2"/>
  <line x1="500" y1="238" x2="300" y2="230" stroke="#b45309" stroke-width="2"/>

</svg>
