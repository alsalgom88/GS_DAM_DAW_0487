<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Fons -->
  <rect x="0" y="0" width="900" height="260" fill="#020617" rx="16"/>

  <!-- Títol -->
  <text x="450" y="32" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="20" fill="#e5e7eb" font-weight="600">
    Patró MVP — Model · View · Presenter
  </text>
  <text x="450" y="52" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" fill="#9ca3af">
    La Vista rep l’acció, però delega tota la lògica al Presenter
  </text>

  <!-- Usuari -->
  <circle cx="80" cy="140" r="32" fill="#6366f1"/>
  <text x="80" y="136" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="26" fill="#e5e7eb">👤</text>
  <text x="80" y="178" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#e5e7eb">Usuari</text>

  <!-- Vista -->
  <rect x="170" y="90" width="170" height="110" rx="12" fill="#020617" stroke="#4f46e5" stroke-width="2"/>
  <text x="255" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="#c7d2fe" font-weight="600">View</text>
  <text x="255" y="138" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">pantalla / Activity / formulari</text>
  <text x="255" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">només pinta i envia esdeveniments</text>

  <!-- Presenter -->
  <rect x="370" y="70" width="190" height="150" rx="12" fill="#020617" stroke="#22c55e" stroke-width="2"/>
  <text x="465" y="98" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="#bbf7d0" font-weight="600">Presenter</text>
  <text x="465" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">conté la lògica d’aplicació</text>
  <text x="465" y="136" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">decideix què mostrar</text>
  <text x="465" y="154" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">crida el Model</text>

  <!-- Model -->
  <rect x="600" y="90" width="180" height="110" rx="12" fill="#020617" stroke="#f97316" stroke-width="2"/>
  <text x="690" y="118" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" fill="#fed7aa" font-weight="600">Model</text>
  <text x="690" y="138" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">dades, repositoris, serveis</text>
  <text x="690" y="156" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#9ca3af">no coneix la View</text>

  <!-- Marcadors fletxes -->
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#e5e7eb"/>
    </marker>
    <marker id="arrowBlueMVP" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowGreenMVP" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowOrangeMVP" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Usuari -> Vista -->
  <line x1="112" y1="140" x2="170" y2="140" stroke="#e5e7eb" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="140" y="132" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#e5e7eb">clic, input</text>

  <!-- Vista -> Presenter (accions) -->
  <line x1="340" y1="120" x2="370" y2="120" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowBlueMVP)"/>
  <text x="355" y="110" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#c7d2fe">esdeveniments</text>

  <!-- Presenter -> Model -->
  <line x1="560" y1="120" x2="600" y2="120" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreenMVP)"/>
  <text x="580" y="110" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#bbf7d0">consultes / ordres</text>

  <!-- Model -> Presenter -->
  <line x1="600" y1="160" x2="560" y2="160" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrangeMVP)"/>
  <text x="580" y="174" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#fed7aa">dades / resultat</text>

  <!-- Presenter -> Vista (actualització UI) -->
  <line x1="370" y1="160" x2="340" y2="160" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreenMVP)"/>
  <text x="355" y="174" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#bbf7d0">updateView()</text>
</svg>
